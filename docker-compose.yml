# MariaDB development stack. From this worktree, do not start this file while
# the main EduPredict containers are running: the container names and host ports
# 8000, 3307, and 8080 are the same. PostgreSQL uses docker-compose.postgres.yml.
services:
  app:
    build: .
    container_name: edupredict_app
    ports:
      - "8000:80"          # Laravel -> http://localhost:8000
      - "5173:5173"        # Vite dev server
    environment:
      ML_API_BASE_URL: http://ml:8000
      ML_API_TOKEN: ${ML_API_TOKEN:-local-dev-ml-token}
      ML_API_TIMEOUT: "5"
      ML_API_CONNECT_TIMEOUT: "2"
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    container_name: edupredict_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootsecret
      MARIADB_DATABASE: edupredict
      MARIADB_USER: edupredict
      MARIADB_PASSWORD: secret
    ports:
      - "3307:3306"        # 3307 on your PC so it won't clash with XAMPP's 3306
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Optional: browse the DB at http://localhost:8080 (replaces XAMPP's phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin:5
    container_name: edupredict_pma
    environment:
      PMA_HOST: db
    ports:
      - "8080:80"
    depends_on:
      - db

  # Research inference on the Compose network only. No host port is published.
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: edupredict_ml
    environment:
      ML_API_TOKEN: ${ML_API_TOKEN:-local-dev-ml-token}
      ML_HOST: 0.0.0.0
      PORT: "8000"
      ML_ENV: local
      ML_INFERENCE_TIMEOUT_SECONDS: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  db_data: