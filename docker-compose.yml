services:
  app:
    build: .
    container_name: edupredict_app
    ports:
      - "8000:80"          # Laravel -> http://localhost:8000
      - "5173:5173"        # Vite dev server
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    container_name: edupredict_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootsecret
      MARIADB_DATABASE: edupredict
      MARIADB_USER: edupredict
      MARIADB_PASSWORD: secret
    ports:
      - "3307:3306"        # 3307 on your PC so it won't clash with XAMPP's 3306
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Optional: browse the DB at http://localhost:8080 (replaces XAMPP's phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin:5
    container_name: edupredict_pma
    environment:
      PMA_HOST: db
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  db_data: